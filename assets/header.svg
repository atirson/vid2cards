<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15181f"/>
      <stop offset="1" stop-color="#1f2430"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- play button (YouTube-style) -->
  <g filter="url(#soft)">
    <rect x="90" y="95" width="200" height="140" rx="28" fill="#ff0000"/>
    <path d="M168 142 L228 165 L168 188 Z" fill="#ffffff"/>
  </g>

  <!-- arrow -->
  <g stroke="#8b93a7" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="340" y1="165" x2="470" y2="165"/>
    <path d="M440 135 L470 165 L440 195"/>
  </g>

  <!-- flashcard stack (Anki-style) -->
  <g filter="url(#soft)">
    <rect x="560" y="120" width="190" height="130" rx="16" fill="#1e3a8a" opacity="0.55" transform="rotate(-6 655 185)"/>
    <rect x="575" y="105" width="190" height="130" rx="16" fill="url(#cardB)" opacity="0.85" transform="rotate(-3 670 170)"/>
    <rect x="590" y="90" width="190" height="130" rx="16" fill="url(#cardA)"/>
    <line x1="615" y1="130" x2="740" y2="130" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <line x1="615" y1="155" x2="715" y2="155" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <line x1="615" y1="180" x2="730" y2="180" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- title -->
  <text x="850" y="150" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="64" font-weight="700" fill="#f5f6fa">Vid2Cards</text>
  <text x="850" y="195" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#aab2c5">YouTube playlists → Anki flashcards</text>
  <text x="850" y="226" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" fill="#aab2c5">running entirely on local models</text>
</svg>
